services:
    app:
        build: .
        ports:
            - "8000:8000"
        env_file:
            - .env
        command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
        depends_on:
            - redis

    celery:
        build: .
        env_file:
            - .env
        depends_on:
            - redis
        command: celery -A app.core.celery_app worker --loglevel=info

    celery-beat:
        build: .
        env_file:
            - .env
        depends_on:
            - redis
        command: celery -A app.core.celery_app beat --loglevel=info

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data

        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5


volumes:
    redis_data: